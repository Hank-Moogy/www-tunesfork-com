name: Release signed macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true

permissions:
  contents: write

jobs:
  build-notarized-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install desktop dependencies
        working-directory: electron
        run: npm ci
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple, and verify
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VITE_AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_PRODUCTION_API_KEY }}
          VITE_AMPLITUDE_SERVER_ZONE: EU
          VITE_APP_VERSION: ${{ inputs.tag || github.ref_name }}
        run: npm run dist:mac:release
      - name: Test quarantined install
        working-directory: electron
        run: npm run smoke:mac-install
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" electron/release/Tunesfork-Sync-mac-universal.dmg electron/release/SHA256SUMS.txt --clobber
